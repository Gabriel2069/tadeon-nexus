name: Finalizar abertura de cena vinculada

on:
  push:
    branches:
      - agent/tabletop-integration-smart-tools
    paths:
      - .github/workflows/tabletop-initial-scene-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabletop-integration-smart-tools
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar abertura de cena exata
        run: python scripts/tabletop_initial_scene_patch.py
      - name: Publicar branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/tabletop/tabletop-workspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(tabletop): abre cena exata vinda do Nexus"
          git push origin HEAD:agent/tabletop-integration-smart-tools
