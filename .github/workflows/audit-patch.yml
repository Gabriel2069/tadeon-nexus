name: Apply general audit patch

on:
  push:
    branches: [agent/general-product-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-product-audit
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {actual}: {old[:90]!r}")
              p.write_text(text.replace(old, new, count))

          # Global tabs: animated indicator must be positioned by the list it measured.
          patch(
              'src/components/ui/tabs.tsx',
              '"inline-flex min-h-11 items-center justify-center gap-1 rounded-[0.9rem] border border-border/60 bg-muted/78 p-1 text-muted-foreground shadow-[inset_0_1px_0_rgba(255,255,255,.035),0_16px_44px_-38px_rgba(0,0,0,.95)] backdrop-blur",',
              '"relative isolate inline-flex min-h-11 items-center justify-center gap-1 rounded-[0.9rem] border border-border/60 bg-muted/78 p-1 text-muted-foreground shadow-[inset_0_1px_0_rgba(255,255,255,.035),0_16px_44px_-38px_rgba(0,0,0,.95)] backdrop-blur",',
          )
          patch('src/styles.css', '  top: 0.25rem;\n  bottom: 0.25rem;\n  left: 0;\n', '  top: 0;\n  bottom: auto;\n  left: 0;\n')

          # Mobile header right rail contains two 44px controls; reserve symmetric room.
          patch('src/components/app-layout.tsx', 'grid-cols-[4.8rem_minmax(0,1fr)_4.8rem]', 'grid-cols-[5.9rem_minmax(0,1fr)_5.9rem]')

          # Active floor is semantic state and must be present in snapshots/events.
          patch(
              'src/lib/tabletop/types.ts',
              'export interface TabletopSnapshot {\n  scene: TabletopScene;\n  selectedIds: string[];\n',
              'export interface TabletopSnapshot {\n  scene: TabletopScene;\n  activeLevelId?: string | null;\n  selectedIds: string[];\n',
          )
          patch(
              'src/lib/tabletop/tabletop-engine.ts',
              '    return {\n      scene: cloneScene(this.scenes.scene),\n      selectedIds: this.selection.ids,\n',
              '    return {\n      scene: cloneScene(this.scenes.scene),\n      activeLevelId: this.activeLevelId,\n      selectedIds: this.selection.ids,\n',
          )
          patch(
              'src/lib/tabletop/tabletop-engine.ts',
              '    this.setSelectedFog(null);\n    this.render(false);\n  }\n\n  setInteractiveStructures',
              '    this.setSelectedFog(null);\n    this.render();\n  }\n\n  setInteractiveStructures',
          )

          # Spatial preload/audio follow the actual active level instead of all visible floors.
          patch(
              'src/components/tabletop/tabletop-reliability-editor-bridge.tsx',
              'interface WallSoundRow {\n  id: string;\n  x1: number | string;\n',
              'interface WallSoundRow {\n  id: string;\n  level_id?: string | null;\n  x1: number | string;\n',
          )
          patch(
              'src/components/tabletop/tabletop-reliability-editor-bridge.tsx',
              '    const activeLevelId = snapshot.scene.levels?.find((level) => level.visible)?.id;\n',
              '    const activeLevelId =\n      snapshot.activeLevelId ?? snapshot.scene.levels?.find((level) => level.visible)?.id;\n',
          )
          patch(
              'src/components/tabletop/tabletop-reliability-editor-bridge.tsx',
              '.select("id,x1,y1,x2,y2,wall_type,blocks_vision,blocks_movement,properties")',
              '.select("id,level_id,x1,y1,x2,y2,wall_type,blocks_vision,blocks_movement,properties")',
          )
          patch(
              'src/components/tabletop/tabletop-reliability-editor-bridge.tsx',
              '    const sources = snapshot.scene.entities\n      .map((entity) => ({ entity, config: audioConfig(entity, snapshot.scene.gridSize) }))\n      .filter((entry): entry is { entity: TabletopEntity; config: AudioSourceConfig } => Boolean(entry.config));\n',
              '    const activeLevelId =\n      snapshot.activeLevelId ?? snapshot.scene.levels?.find((level) => level.visible)?.id;\n    const activeWalls = activeLevelId\n      ? walls.filter((wall) => !wall.level_id || wall.level_id === activeLevelId)\n      : walls;\n    const sources = snapshot.scene.entities\n      .filter((entity) => !activeLevelId || !entity.levelId || entity.levelId === activeLevelId)\n      .map((entity) => ({ entity, config: audioConfig(entity, snapshot.scene.gridSize) }))\n      .filter((entry): entry is { entity: TabletopEntity; config: AudioSourceConfig } => Boolean(entry.config));\n',
          )
          patch(
              'src/components/tabletop/tabletop-reliability-editor-bridge.tsx',
              '      const wallGain = soundTransmissionBetween(source, listener, walls);\n',
              '      const wallGain = soundTransmissionBetween(source, listener, activeWalls);\n',
          )

          # Tactical bridge: remove the hidden radial clone observer and make Powers touch-operable.
          p = Path('src/components/tabletop/tabletop-player-interaction-bridge.tsx')
          text = p.read_text()
          start = text.index('function useRadialContextMenu() {')
          end = text.index('\nexport function TabletopPlayerInteractionBridge()', start)
          text = text[:start] + text[end + 1:]
          text = text.replace('export function TabletopPlayerInteractionBridge() {\n  useRadialContextMenu();\n', 'export function TabletopPlayerInteractionBridge() {\n', 1)
          text = text.replace('  const [loadingPowers, setLoadingPowers] = useState(false);\n  const sheetRequestRef = useRef(0);\n', '  const [loadingPowers, setLoadingPowers] = useState(false);\n  const [powerMenuOpen, setPowerMenuOpen] = useState(false);\n  const sheetRequestRef = useRef(0);\n', 1)
          text = text.replace('  const linkedSheetId = entity?.linkedSheetId ?? null;\n', '  const linkedSheetId =\n    entity?.linkedSheetId ??\n    ((entity as (TabletopEntity & { sheetSummary?: { sheetId?: string } }) | null)\n      ?.sheetSummary?.sheetId ?? null);\n', 1)
          text = text.replace('  useEffect(() => {\n    setTargetIds(new Set());\n  }, [activePower?.id]);\n', '  useEffect(() => {\n    setTargetIds(new Set());\n  }, [activePower?.id]);\n\n  useEffect(() => {\n    setPowerMenuOpen(false);\n  }, [entity?.id]);\n', 1)
          text = text.replace('      if (event.key !== "Escape") return;\n      setMode("idle");\n', '      if (event.key !== "Escape") return;\n      setPowerMenuOpen(false);\n      setMode("idle");\n', 1)
          text = text.replace('          <div className="tadeon-tactical-dock__power-menu">\n            <Button\n', '          <div\n            className="tadeon-tactical-dock__power-menu"\n            data-open={powerMenuOpen ? "true" : "false"}\n          >\n            <Button\n', 1)
          text = text.replace('              disabled={!entity || loadingPowers || templates.length === 0}\n              title={\n', '              disabled={!entity || loadingPowers || templates.length === 0}\n              aria-haspopup="menu"\n              aria-expanded={powerMenuOpen}\n              onClick={() => setPowerMenuOpen((current) => !current)}\n              title={\n', 1)
          text = text.replace('              <div className="tadeon-tactical-dock__power-list">\n', '              <div className="tadeon-tactical-dock__power-list" role="menu">\n', 1)
          text = text.replace('                    onClick={() => {\n                      setActivePower(template);\n', '                    role="menuitem"\n                    onClick={() => {\n                      setPowerMenuOpen(false);\n                      setActivePower(template);\n', 1)
          p.write_text(text)
          patch(
              'src/styles/tabletop-player-interaction.css',
              '.tadeon-tactical-dock__power-menu:hover .tadeon-tactical-dock__power-list,\n.tadeon-tactical-dock__power-menu:focus-within .tadeon-tactical-dock__power-list {\n',
              '.tadeon-tactical-dock__power-menu:hover .tadeon-tactical-dock__power-list,\n.tadeon-tactical-dock__power-menu:focus-within .tadeon-tactical-dock__power-list,\n.tadeon-tactical-dock__power-menu[data-open="true"] .tadeon-tactical-dock__power-list {\n',
          )

          # Server-computed visibility polygon remains authoritative for participant privacy/parity.
          patch(
              'src/lib/tabletop/visibility-renderer.ts',
              'function visibilityPolygonForLight(\n  light: TabletopLight,\n  radius: number,\n  walls: TabletopVisibilityState["walls"],\n  scene: TabletopScene,\n) {\n  return buildVisibilityPolygon(\n',
              'function visibilityPolygonForLight(\n  light: TabletopLight,\n  radius: number,\n  walls: TabletopVisibilityState["walls"],\n  scene: TabletopScene,\n) {\n  if (light.visibilityPolygon && light.visibilityPolygon.length >= 3) {\n    return light.visibilityPolygon;\n  }\n  return buildVisibilityPolygon(\n',
          )

          # Participant decoder accepts authorized light/fog presentation metadata.
          patch(
              'src/lib/tabletop/tabletop-participant-service.ts',
              '            castsShadows: z.boolean(),\n            visibilityPolygon: z\n',
              '            castsShadows: z.boolean(),\n            properties: z\n              .object({\n                shape: z.enum(["radial", "cone", "line", "rectangle"]).optional(),\n                angle: finiteNumber.min(1).max(360).optional(),\n                direction: finiteNumber.min(-3600).max(3600).optional(),\n                falloff: finiteNumber.min(0.1).max(4).optional(),\n                softness: finiteNumber.min(0).max(1).optional(),\n                temperature: finiteNumber.min(1000).max(12000).optional(),\n                flicker: finiteNumber.min(0).max(1).optional(),\n                particles: z.enum(["none", "dust", "embers", "mist", "sparks"]).optional(),\n              })\n              .strict()\n              .optional(),\n            visibilityPolygon: z\n',
          )
          patch(
              'src/lib/tabletop/tabletop-participant-service.ts',
              '            operation: z.enum(["reveal", "hide"]),\n            points: z.array(visibilityPointSchema).min(1).max(64),\n',
              '            operation: z.enum(["reveal", "hide"]),\n            shape: z.enum(["brush", "rectangle", "ellipse", "polygon"]),\n            points: z.array(visibilityPointSchema).min(1).max(64),\n',
          )

          # Edge participant projection: keep hidden entities filtered, enrich only safe rendering contracts.
          p = Path('supabase/functions/tabletop-view/index.ts')
          text = p.read_text()
          text = text.replace(
              'interface VisibilityWall {\n  x1: number;\n  y1: number;\n  x2: number;\n  y2: number;\n  wallType: string;\n  blocksVision: boolean;\n}\n',
              'interface VisibilityWall {\n  x1: number;\n  y1: number;\n  x2: number;\n  y2: number;\n  wallType: string;\n  blocksVision: boolean;\n  baseElevation: number;\n  height: number;\n}\n\ntype PublicLightShape = "radial" | "cone" | "line" | "rectangle";\n\nfunction normalizedAngleDelta(angle: number, reference: number) {\n  let delta = angle - reference;\n  while (delta <= -Math.PI) delta += Math.PI * 2;\n  while (delta > Math.PI) delta -= Math.PI * 2;\n  return delta;\n}\n\nfunction publicLightProperties(value: unknown) {\n  const source = objectValue(value);\n  const shape: PublicLightShape =\n    source.shape === "cone" || source.shape === "line" || source.shape === "rectangle"\n      ? source.shape\n      : "radial";\n  const particles =\n    source.particles === "dust" || source.particles === "embers" || source.particles === "mist" || source.particles === "sparks"\n      ? source.particles\n      : "none";\n  return {\n    shape,\n    angle: Math.max(1, Math.min(360, finiteNumber(source.angle, 90))),\n    direction: finiteNumber(source.direction, 0) % 360,\n    falloff: Math.max(0.1, Math.min(4, finiteNumber(source.falloff, 1.4))),\n    softness: Math.max(0, Math.min(1, finiteNumber(source.softness, 0.4))),\n    temperature: Math.max(1000, Math.min(12000, finiteNumber(source.temperature, 4200))),\n    flicker: Math.max(0, Math.min(1, finiteNumber(source.flicker, 0))),\n    particles,\n  };\n}\n\nfunction lightDirection(light: { properties: ReturnType<typeof publicLightProperties> }) {\n  return (light.properties.direction * Math.PI) / 180;\n}\n\nfunction lightRayLimit(light: { radius: number; properties: ReturnType<typeof publicLightProperties> }, angle: number) {\n  const radius = Math.max(8, light.radius);\n  if (light.properties.shape === "radial") return radius;\n  const delta = normalizedAngleDelta(angle, lightDirection(light));\n  if (light.properties.shape === "cone") {\n    const aperture = Math.max(1, Math.min(359, light.properties.angle));\n    return Math.abs(delta) <= (aperture * Math.PI) / 360 + 1e-6 ? radius : 0;\n  }\n  if (Math.cos(delta) < -1e-6 || Math.abs(delta) > Math.PI / 2 + 1e-6) return 0;\n  const halfWidth = light.properties.shape === "line" ? Math.max(6, radius * 0.08) : radius * 0.42;\n  const cosine = Math.max(1e-6, Math.cos(delta));\n  const sine = Math.abs(Math.sin(delta));\n  return Math.max(0, Math.min(radius / cosine, sine < 1e-6 ? Number.POSITIVE_INFINITY : halfWidth / sine));\n}\n\nfunction lightSeedAngles(light: { radius: number; properties: ReturnType<typeof publicLightProperties> }) {\n  const direction = lightDirection(light);\n  const angles: number[] = [];\n  if (light.properties.shape === "radial") {\n    for (let index = 0; index < 128; index += 1) angles.push((index / 128) * Math.PI * 2);\n    return angles;\n  }\n  if (light.properties.shape === "cone") {\n    const aperture = Math.max(1, Math.min(359, light.properties.angle));\n    const half = (aperture * Math.PI) / 360;\n    const steps = Math.max(16, Math.ceil(aperture / 5));\n    for (let index = 0; index <= steps; index += 1) angles.push(direction - half + (index / steps) * half * 2);\n    return angles;\n  }\n  for (let index = 0; index <= 72; index += 1) angles.push(direction - Math.PI / 2 + (index / 72) * Math.PI);\n  return angles;\n}\n',
              1,
          )
          start = text.index('function buildVisibilityPolygon(')
          end = text.index('\nfunction safeFogPoints', start)
          builder = '''function buildVisibilityPolygon(\n  light: {\n    x: number;\n    y: number;\n    radius: number;\n    castsShadows: boolean;\n    elevation: number;\n    properties: ReturnType<typeof publicLightProperties>;\n  },\n  walls: VisibilityWall[],\n  width: number,\n  height: number,\n) {\n  const boundary: VisibilityWall[] = [\n    { x1: 0, y1: 0, x2: width, y2: 0, wallType: "wall", blocksVision: true, baseElevation: 0, height: 100_000 },\n    { x1: width, y1: 0, x2: width, y2: height, wallType: "wall", blocksVision: true, baseElevation: 0, height: 100_000 },\n    { x1: width, y1: height, x2: 0, y2: height, wallType: "wall", blocksVision: true, baseElevation: 0, height: 100_000 },\n    { x1: 0, y1: height, x2: 0, y2: 0, wallType: "wall", blocksVision: true, baseElevation: 0, height: 100_000 },\n  ];\n  const blockers = light.castsShadows\n    ? [...walls.filter((wall) => wall.blocksVision && wall.wallType !== "door_open" && light.elevation <= wall.baseElevation + wall.height + 0.5), ...boundary]\n    : boundary;\n  const angles = lightSeedAngles(light);\n  for (const wall of blockers) {\n    for (const point of [{ x: wall.x1, y: wall.y1 }, { x: wall.x2, y: wall.y2 }]) {\n      const angle = Math.atan2(point.y - light.y, point.x - light.x);\n      if (lightRayLimit(light, angle) <= 0) continue;\n      angles.push(angle - 0.0001, angle, angle + 0.0001);\n    }\n  }\n  const direction = lightDirection(light);\n  const unique = [...new Map(angles.filter((angle) => lightRayLimit(light, angle) > 0).map((angle) => [Math.round(angle * 1_000_000), angle])).values()];\n  unique.sort((left, right) =>\n    light.properties.shape === "radial"\n      ? ((left % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - (((right % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2))\n      : normalizedAngleDelta(left, direction) - normalizedAngleDelta(right, direction),\n  );\n  return unique.map((angle) => {\n    const directionVector = { x: Math.cos(angle), y: Math.sin(angle) };\n    let distance = lightRayLimit(light, angle);\n    for (const wall of blockers) {\n      const hit = raySegmentDistance({ x: light.x, y: light.y }, directionVector, wall);\n      if (hit !== null && hit < distance) distance = hit;\n    }\n    return { x: light.x + directionVector.x * distance, y: light.y + directionVector.y * distance };\n  });\n}\n'''
          text = text[:start] + builder + text[end:]
          old_public = '''  return {\n    ...(status ? { status } : {}),\n    ...(icons.length ? { icons } : {}),\n    ...(visualConditions.length ? { visual_conditions: visualConditions } : {}),\n    ...(barMax > 0 ? { bar_max: barMax, bar_current: barCurrent } : {}),\n  };\n}\n'''
          new_public = '''  const renderMode = properties.render_mode === "flat" || properties.render_mode === "billboard" ? properties.render_mode : undefined;\n  const auraColor = typeof properties.aura_color === "string" && /^#[0-9a-f]{6}$/i.test(properties.aura_color) ? properties.aura_color : undefined;\n  const audioUrl = typeof properties.audio_url === "string" && /^https?:\\/\\//i.test(properties.audio_url.trim()) ? properties.audio_url.trim().slice(0, 2048) : undefined;\n  return {\n    ...(status ? { status } : {}),\n    ...(icons.length ? { icons } : {}),\n    ...(visualConditions.length ? { visual_conditions: visualConditions } : {}),\n    ...(barMax > 0 ? { bar_max: barMax, bar_current: barCurrent } : {}),\n    ...(renderMode ? { render_mode: renderMode } : {}),\n    billboard_anchor: properties.billboard_anchor === "center" ? "center" : "base",\n    visual_scale: Math.max(0.5, Math.min(2.5, finiteNumber(properties.visual_scale, 1))),\n    ground_shadow: properties.ground_shadow !== false,\n    token_volume: properties.token_volume !== false,\n    token_base_height: Math.max(4, Math.min(22, finiteNumber(properties.token_base_height, 8))),\n    ...(auraColor ? { aura_color: auraColor } : {}),\n    aura_intensity: Math.max(0, Math.min(1, finiteNumber(properties.aura_intensity, 0.56))),\n    ...(audioUrl ? { audio_url: audioUrl } : {}),\n    audio_enabled: properties.audio_enabled !== false,\n    audio_loop: properties.audio_loop !== false,\n    audio_volume: Math.max(0, Math.min(1, finiteNumber(properties.audio_volume, 0.72))),\n    audio_radius: Math.max(8, Math.min(100_000, finiteNumber(properties.audio_radius, 512))),\n  };\n}\n'''
          if old_public not in text:
              raise SystemExit('edge publicProperties contract missing')
          text = text.replace(old_public, new_public, 1)
          text = text.replace('"id,level_id,x,y,elevation,radius,intensity,color,enabled,casts_shadows",', '"id,level_id,entity_id,x,y,elevation,radius,intensity,color,enabled,casts_shadows,properties",', 1)
          text = text.replace('.select("id,level_id,operation,points,radius,sequence_index")', '.select("id,level_id,operation,geometry,points,radius,sequence_index")', 1)
          text = text.replace('    wallType: boundedText(wall.wall_type, 24),\n    blocksVision: wall.blocks_vision === true,\n  }));\n', '    wallType: boundedText(wall.wall_type, 24),\n    blocksVision: wall.blocks_vision === true,\n    baseElevation: finiteNumber(wall.base_elevation),\n    height: Math.max(8, finiteNumber(wall.height, 64)),\n  }));\n', 1)
          text = text.replace('''        const safeLight = {\n          x: finiteNumber(light.x),\n          y: finiteNumber(light.y),\n          radius: radius * Math.max(0.12, intensity),\n          castsShadows: light.casts_shadows === true,\n        };\n''', '''        const attachedEntity =\n          typeof light.entity_id === "string"\n            ? (entities ?? []).find((entity) => entity.id === light.entity_id && entity.level_id === activeLevelId)\n            : null;\n        const properties = publicLightProperties(light.properties);\n        const safeLight = {\n          x: attachedEntity ? finiteNumber(attachedEntity.x) + Math.max(8, finiteNumber(attachedEntity.width, 64)) / 2 : finiteNumber(light.x),\n          y: attachedEntity ? finiteNumber(attachedEntity.y) + Math.max(8, finiteNumber(attachedEntity.height, 64)) / 2 : finiteNumber(light.y),\n          elevation: finiteNumber(light.elevation) + (attachedEntity ? finiteNumber(attachedEntity.elevation) : 0),\n          radius: radius * Math.max(0.12, intensity),\n          castsShadows: light.casts_shadows === true,\n          properties,\n        };\n''', 1)
          text = text.replace('          x: safeLight.x,\n          y: safeLight.y,\n          elevation: finiteNumber(light.elevation),\n', '          x: safeLight.x,\n          y: safeLight.y,\n          elevation: safeLight.elevation,\n', 1)
          text = text.replace('          castsShadows: safeLight.castsShadows,\n          visibilityPolygon:', '          castsShadows: safeLight.castsShadows,\n          properties,\n          visibilityPolygon:', 1)
          text = text.replace('        operation: stroke.operation === "hide" ? "hide" : "reveal",\n        points: safeFogPoints(stroke.points),\n', '        operation: stroke.operation === "hide" ? "hide" : "reveal",\n        shape:\n          stroke.geometry === "rectangle" || stroke.geometry === "ellipse" || stroke.geometry === "polygon"\n            ? stroke.geometry\n            : "brush",\n        points: safeFogPoints(stroke.points),\n', 1)
          p.write_text(text)

          # Mesa modal hierarchy: Sheet/Drawer cannot sit below fixed tabletop controls.
          p = Path('src/styles/viewport-fit-final.css')
          text = p.read_text()
          insert = '''\n/* Sheets/drawers share the same modal authority as dialogs while Mesa chrome is mounted. */\nbody:has(.tadeon-tabletop-studio) :where(\n  [data-slot="sheet-overlay"],\n  [data-slot="drawer-overlay"]\n) {\n  z-index: 240 !important;\n}\n\nbody:has(.tadeon-tabletop-studio) :where(\n  [data-slot="sheet-content"],\n  [data-slot="drawer-content"]\n) {\n  z-index: 241 !important;\n  max-inline-size: calc(100vw - (var(--tadeon-overlay-gutter) * 2));\n  max-block-size: calc(100dvh - (var(--tadeon-overlay-gutter) * 2));\n  overscroll-behavior: contain;\n}\n'''
          marker = '\n@media (min-width: 801px) {'
          text = text[:text.index(marker)] + insert + text[text.index(marker):]
          p.write_text(text)

          # Tablet inspector is non-modal: keep essential command dock in the remaining stage.
          p = Path('src/styles/tabletop-spatial-finish.css')
          text = p.read_text()
          marker = '@media (min-width: 801px) and (max-width: 1179px) {\n  .tadeon-tabletop-panel[data-mobile-open="true"] {\n'
          replacement = '@media (min-width: 801px) and (max-width: 1179px) {\n  body:has(.tadeon-tabletop-panel[data-mobile-open="true"]) {\n    --tadeon-tabletop-inspector-width: min(28rem, calc(100vw - 2rem));\n  }\n\n  body:has(.tadeon-tabletop-panel[data-mobile-open="true"])\n    .tadeon-tabletop-progressive-dock {\n    left: calc((100vw - var(--tadeon-tabletop-inspector-width)) / 2) !important;\n    max-width: calc(100vw - var(--tadeon-tabletop-inspector-width) - 2rem) !important;\n    opacity: 1 !important;\n    visibility: visible !important;\n    pointer-events: auto !important;\n  }\n\n  .tadeon-tabletop-panel[data-mobile-open="true"] {\n'
          if marker not in text:
              raise SystemExit('tablet inspector marker missing')
          p.write_text(text.replace(marker, replacement, 1))

          # Regression coverage for the audit findings.
