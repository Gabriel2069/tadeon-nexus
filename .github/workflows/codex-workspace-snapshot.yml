name: Codex workspace snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: tar --exclude=.git -czf /tmp/tadeon-nexus-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tadeon-nexus-source
          path: /tmp/tadeon-nexus-source.tar.gz
          retention-days: 1
