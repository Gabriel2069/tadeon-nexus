name: Finalizar runtime da Mesa

on:
  push:
    branches:
      - agent/tabletop-final-stability
    paths:
      - .github/workflows/finalize-tabletop-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabletop-final-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar patch
        run: python scripts/finalize_tabletop_runtime.py
      - name: Remover auxiliares e publicar branch
        run: |
          rm -f scripts/finalize_tabletop_runtime.py .github/workflows/finalize-tabletop-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(tabletop): estabiliza runtime, autosave e grades"
          git push origin HEAD:agent/tabletop-final-stability
