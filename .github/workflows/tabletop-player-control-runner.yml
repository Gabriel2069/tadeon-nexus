name: Tabletop player control runner

on:
  push:
    branches: [main]
    paths: [.github/workflows/tabletop-player-control-runner.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabletop-final-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar controle e estabilidade finais
        run: python scripts/finalize_tabletop_player_control.py
      - name: Publicar branch limpo
        run: |
          rm -f scripts/finalize_tabletop_player_control.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(tabletop): fecha controle, autosave e estabilidade"
          git push origin HEAD:agent/tabletop-final-stability
      - name: Remover runner temporário
        run: |
          git fetch origin main
          git switch -C main origin/main
          git rm .github/workflows/tabletop-player-control-runner.yml
          git commit -m "chore: remove runner temporário de controle da mesa"
          git push origin main
