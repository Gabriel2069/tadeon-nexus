name: Aplicar ajuste adaptativo da Mesa

on:
  push:
    branches:
      - agent/tabletop-progressive-rebuild
    paths:
      - .tabletop-progressive-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabletop-progressive-rebuild
          fetch-depth: 0
      - name: Ajustar qualidade inicial do Pixi
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/tabletop/tabletop-engine.ts')
          text = path.read_text()
          old = '''    const width = Math.max(320, host.clientWidth);
              const height = Math.max(320, host.clientHeight);
              await this.app.init({
                width,
                height,
                antialias: true,
                autoDensity: true,
                resolution: Math.min(window.devicePixelRatio || 1, 2),
                backgroundColor: 0x080a0f,
                autoStart: false,
                preference: "webgl",
              });'''.replace('              ', '    ')
          new = '''    const width = Math.max(320, host.clientWidth);
    const height = Math.max(320, host.clientHeight);
    const navigatorWithMemory = navigator as Navigator & { deviceMemory?: number };
    const forcedCompatibility = window.localStorage.getItem("tadeon-tabletop-low-power") === "true";
    const constrainedDevice =
      forcedCompatibility ||
      window.matchMedia("(pointer: coarse)").matches ||
      Math.min(window.innerWidth, window.innerHeight) < 820 ||
      (navigator.hardwareConcurrency ?? 8) <= 4 ||
      (navigatorWithMemory.deviceMemory ?? 8) <= 4;
    const rendererResolution = constrainedDevice
      ? 1
      : Math.min(window.devicePixelRatio || 1, window.innerWidth < 1280 ? 1.5 : 2);
    await this.app.init({
      width,
      height,
      antialias: !constrainedDevice,
      autoDensity: true,
      resolution: rendererResolution,
      backgroundColor: 0x080a0f,
      autoStart: false,
      preference: "webgl",
    });'''
          if old not in text:
              raise SystemExit('trecho de inicialização do motor não encontrado')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Registrar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tabletop/tabletop-engine.ts
          git commit -m "perf(tabletop): adapta resolução ao dispositivo"
          git push origin HEAD:agent/tabletop-progressive-rebuild
