name: Tabletop branch patch runner

on:
  push:
    branches: [main]
    paths: [.github/workflows/tabletop-branch-patch-runner.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabletop-final-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar patch final no branch
        run: python scripts/finalize_tabletop_runtime.py
      - name: Commitar branch sem auxiliares
        run: |
          rm -f scripts/finalize_tabletop_runtime.py .github/workflows/finalize-tabletop-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tabletop): estabiliza runtime, autosave e grades"
          git push origin HEAD:agent/tabletop-final-stability
      - name: Remover runner temporário do main
        run: |
          git fetch origin main
          git switch -C main origin/main
          git rm .github/workflows/tabletop-branch-patch-runner.yml
          git commit -m "chore: remove runner temporário da mesa"
          git push origin main
