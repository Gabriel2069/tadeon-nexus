name: Normalize typography

on:
  push:
    branches:
      - agent/final-sheet-density-tilde

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-sheet-density-tilde
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace long dashes with tilde
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const allowed = new Set(['.ts','.tsx','.css','.md','.json','.html']);
          const dash = String.fromCodePoint(0x2014);
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name))) {
                const before = fs.readFileSync(full, 'utf8');
                const after = before.split(dash).join('~');
                if (after !== before) fs.writeFileSync(full, after);
              }
            }
          }
          walk('src');
          NODE
      - name: Commit normalized typography
        run: |
          if git diff --quiet -- src; then exit 0; fi
          git config user.name "Rpg"
          git config user.email "110940057+Gabriel2069@users.noreply.github.com"
          git add src
          git commit -m "style: troca travessao longo por tilde"
          git push origin HEAD:agent/final-sheet-density-tilde
