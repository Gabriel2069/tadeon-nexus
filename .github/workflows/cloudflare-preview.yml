name: Publicar no Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar Worker
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      CI: true
      TADEON_DEPLOY_SHA: ${{ github.sha }}
      TADEON_PUBLIC_APP_URL: https://tadeon-nexus.gtadeusz.workers.dev
      VITE_APP_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Baixar exatamente o SHA de main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validar configurações obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::A configuração ${variable} não foi encontrada."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar npm do projeto
        run: npm install --global npm@11.9.0

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar projeto e gerar build
        run: npm run check

      - name: Verificar arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          test -d .output
          echo "Build gerado corretamente para ${TADEON_DEPLOY_SHA}."

      - name: Verificar autenticação da Cloudflare
        run: npx wrangler whoami

      - name: Publicar produção
        env:
          NODE_ENV: production
        run: npx nitro deploy --prebuilt

      - name: Confirmar produção no SHA publicado
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            page="$(curl --fail --silent --show-error --location "${TADEON_PUBLIC_APP_URL}/login" || true)"
            if printf '%s' "$page" | grep -Fq 'name="tadeon-build-sha"' && \
              printf '%s' "$page" | grep -Fq "${TADEON_DEPLOY_SHA}"; then
              echo "Produção confirmada no SHA ${TADEON_DEPLOY_SHA}."
              exit 0
            fi

            echo "Tentativa ${attempt}/12: aguardando propagação do Worker."
            sleep 5
          done

          echo "::error::O endpoint público não confirmou o SHA ${TADEON_DEPLOY_SHA}."
          exit 1
