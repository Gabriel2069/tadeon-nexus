name: Publicar no Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      TADEON_DEPLOY_SHA: ${{ github.sha }}
      TADEON_PUBLIC_APP_URL: https://tadeon-nexus.gtadeusz.workers.dev
      VITE_APP_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Baixar exatamente o commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validar configurações obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::A configuração $key não foi encontrada."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar npm do projeto
        run: npm install --global npm@11.9.0

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Verificar projeto
        run: npm run check

      - name: Verificar autenticação da Cloudflare
        run: npx wrangler whoami

      - name: Publicar produção
        env:
          NODE_ENV: production
        run: npx nitro deploy --prebuilt

      - name: Confirmar produção no SHA publicado
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            page="$(curl --fail --silent --show-error --location "${TADEON_PUBLIC_APP_URL}/login" || true)"
            if printf '%s' "$page" | grep -Fq 'name="tadeon-build-sha"' && \
              printf '%s' "$page" | grep -Fq "${TADEON_DEPLOY_SHA}"; then
              echo "Produção confirmada no SHA ${TADEON_DEPLOY_SHA}."
              exit 0
            fi
            echo "Tentativa ${attempt}/12: aguardando propagação do Worker."
            sleep 5
          done
          echo "::error::O endpoint público não confirmou o SHA ${TADEON_DEPLOY_SHA}."
          exit 1
