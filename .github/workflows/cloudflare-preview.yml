name: Publicar no Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar Worker
    # Manual dispatch must obey the same production branch boundary as push.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      TADEON_DEPLOY_SHA: ${{ github.sha }}
      TADEON_PUBLIC_APP_URL: https://tadeon-nexus.gtadeusz.workers.dev
      VITE_APP_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Baixar exatamente o commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validar configurações obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::A configuração $key não foi encontrada."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar npm do projeto
        run: npm install --global npm@11.9.0

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Auditar dependências de aplicação e build
        run: npm audit --audit-level=high

      - name: Verificar projeto
        run: npm run check

      - name: Verificar autenticação da Cloudflare
        run: npx wrangler whoami

      - name: Publicar produção
        env:
          NODE_ENV: production
        run: npx nitro deploy --prebuilt

      - name: Confirmar produção no SHA publicado
        run: node scripts/verify-production-build.mjs

      - name: Conferir pacote canônico publicado
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const source = readFileSync("public/nexus-packs/tadeon-nexus-canonico-atual.zip");
          const digest = value => createHash("sha256").update(value).digest("hex");
          const expected = digest(source);
          const endpoint = new URL("/nexus-packs/tadeon-nexus-canonico-atual.zip", process.env.TADEON_PUBLIC_APP_URL);
          endpoint.searchParams.set("deploy_sha", process.env.TADEON_DEPLOY_SHA);
          let proof, last = "";
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(endpoint, { headers: { "Cache-Control": "no-cache" }, signal: AbortSignal.timeout(15000) });
              const bytes = Buffer.from(await response.arrayBuffer());
              const report = { httpStatus: response.status, bytes: bytes.length, sha256: digest(bytes), sourceCommit: process.env.TADEON_DEPLOY_SHA, verifiedAt: new Date().toISOString() };
              if (response.ok && bytes.length === source.length && report.sha256 === expected) { proof = report; break; }
              last = JSON.stringify(report);
            } catch (error) { last = error.message; }
            if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!proof) throw new Error("Canonical pack verification failed: " + last);
          console.log("Canonical pack confirmed: " + JSON.stringify(proof));
          JS
