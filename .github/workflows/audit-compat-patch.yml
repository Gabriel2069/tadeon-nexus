name: Apply audit compatibility patch
on:
  push:
    branches: [agent/general-product-audit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/general-product-audit
      - name: Keep old participant fog payloads compatible
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/lib/tabletop/tabletop-participant-service.ts')
          text = p.read_text()
          old = '            shape: z.enum(["brush", "rectangle", "ellipse", "polygon"]),\n'
          new = '            shape: z.enum(["brush", "rectangle", "ellipse", "polygon"]).default("brush"),\n'
          if text.count(old) != 1:
              raise SystemExit('fog shape schema marker missing or duplicated')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/audit-compat-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tabletop): preserve rolling fog compatibility"
          git push origin HEAD:agent/general-product-audit
