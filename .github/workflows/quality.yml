name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fixar npm do projeto
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Auditar dependências de aplicação e build
        run: npm audit --audit-level=high
      - name: Verificar arquitetura de estilos
        run: npm run check:styles
      - name: Verificar mapas e continuidade
        run: npm run check:project
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
