name: Aplicar fechamento de UI e CRUD

on:
  push:
    branches:
      - agent/runtime-ui-crud-final
    paths:
      - .github/workflows/runtime-ui-crud-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-ui-crud-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar correções finais
        run: python scripts/runtime_ui_crud_final_patch.py
      - name: Publicar branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "fix: fecha regressões de UI, Mesa e exclusão"
          git push origin HEAD:agent/runtime-ui-crud-final
